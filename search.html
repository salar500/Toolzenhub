<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Search ToolZen Hub articles and find useful guides, tips and explanations."
    >

    <title>Search Articles | ToolZen Hub</title>


    <!-- =====================================================
         GLOBAL CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="/Toolzenhub/assets/css/global.css"
    >


    <!-- =====================================================
         ARTICLES CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="/Toolzenhub/assets/css/pages/articles.css"
    >


    <!-- =====================================================
         SEARCH PAGE CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="/Toolzenhub/assets/css/pages/search.css"
    >

</head>


<body>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header id="header"></header>


    <!-- =====================================================
         SEARCH PAGE
    ====================================================== -->

    <main id="search-page">


        <!-- =================================================
             SEARCH HERO
        ================================================== -->

        <section class="search-hero">

            <div class="articles-container">

                <div class="search-hero-content">

                    <span class="search-eyebrow">
                        ToolZen Hub Articles
                    </span>

                    <h1>
                        Search Articles
                    </h1>

                    <p>
                        Find useful guides, explanations, tips and
                        financial knowledge from ToolZen Hub.
                    </p>


                    <!-- =====================================
                         ARTICLE SEARCH FORM
                    ====================================== -->

                    <form
                        id="article-search-form"
                        class="search-form"
                        role="search"
                        novalidate
                    >

                        <label
                            for="article-search-input"
                            class="sr-only"
                        >
                            Search articles
                        </label>


                        <input
                            id="article-search-input"
                            type="search"
                            name="q"
                            placeholder="Search articles..."
                            autocomplete="off"
                            spellcheck="false"
                        >


                        <button
                            type="submit"
                            aria-label="Search articles"
                        >
                            Search
                        </button>

                    </form>

                </div>

            </div>

        </section>


        <!-- =================================================
             SEARCH RESULTS AREA
        ================================================== -->

        <section class="search-results-section">

            <div class="articles-container">


                <!-- =========================================
                     SEARCH INFORMATION
                ========================================== -->

                <div
                    id="search-results-heading"
                    class="search-results-heading"
                ></div>


                <!-- =========================================
                     RESULTS
                ========================================== -->

                <div
                    id="article-search-results"
                    class="article-search-results"
                    aria-live="polite"
                ></div>


            </div>

        </section>


    </main>


    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer id="footer"></footer>


    <!-- =====================================================
         HEADER / FOOTER COMPONENTS
    ====================================================== -->

    <script
        type="module"
        src="/Toolzenhub/assets/js/components/header.js"
    ></script>

    <script
        type="module"
        src="/Toolzenhub/assets/js/components/footer.js"
    ></script>


    <!-- =====================================================
         ARTICLE SEARCH PAGE
    ====================================================== -->

    <script
        type="module"
        src="/Toolzenhub/assets/js/pages/search.js"
    ></script>


</body>

</html>
