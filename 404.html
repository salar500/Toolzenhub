<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Page Not Found | ToolZen Hub</title>

    <meta
        name="description"
        content="The page you are looking for could not be found on ToolZen Hub."
    >

    <meta name="robots" content="noindex">

    <meta name="theme-color" content="#2563eb">


    <!-- =====================================================
         Favicon

         GitHub Pages serves this file at whatever URL was
         requested (for example /Toolzenhub/a/b/missing), so
         page-relative paths cannot be trusted here. The
         relative href is only the no-JavaScript fallback; the
         script below replaces it with the correct site-root
         path before the browser requests it.
    ====================================================== -->

    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <script>
        /*
         * Site root - same rule as assets/js/routes.js:
         * GitHub Pages project site -> /Toolzenhub/
         * any other host (custom / root domain) -> /
         */
        (function () {

            var root =
                window.location.hostname === "salar500.github.io"
                    ? "/Toolzenhub/"
                    : "/";

            var icon =
                document.querySelector('link[rel="icon"]');

            if (icon) {
                icon.setAttribute("href", root + "favicon.svg");
            }

            document.addEventListener("DOMContentLoaded", function () {

                var links =
                    document.querySelectorAll("[data-route]");

                for (var i = 0; i < links.length; i++) {

                    links[i].setAttribute(
                        "href",
                        root + links[i].getAttribute("data-route")
                    );

                }

            });

        })();
    </script>


    <!-- Without JavaScript the site root cannot be determined from
         an arbitrary-depth 404 URL, so the navigation links are
         hidden. The error message itself is plain HTML and always
         visible. -->

    <noscript>
        <style>
            .nf-nav { display: none; }
        </style>
    </noscript>


    <!-- Fonts (absolute URL, works at any path depth) -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

         Styles - inline on purpose: this page must not depend
         on any relative stylesheet path.
    ====================================================== -->

    </style>

</head>

</html>
