<!DOCTYPE html>
<html lang="en">

<head> 

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Contact ToolZen Hub for questions, feedback, suggestions, or support."
    >

    <title>Contact Us | ToolZen Hub</title>


    <!-- =====================================================
         Global Header CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="assets/css/components/header.css"
    >


    <!-- =====================================================
         Global Footer CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="assets/css/components/footer.css"
    >


    <!-- =====================================================
         Page CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="assets/css/pages/contact.css"
    >

</head>


<body>


    <!-- =====================================================
         Global Header
    ====================================================== -->

    <div id="header"></div>


    <!-- =====================================================
         Main Content
    ====================================================== -->

    <main class="contact-page">

        <section class="contact-page__hero">

            <div class="container">

                <h1>
                    Contact Us
                </h1>

                <p>
                    Have a question, suggestion, or feedback?
                    We'd love to hear from you.
                </p>

            </div>

        </section>


        <section class="contact-page__content">

            <div class="container">

                <div class="contact-page__card">

                    <h2>
                        Get in Touch
                    </h2>

                    <p>
                        If you have questions about ToolZen Hub,
                        our calculators, articles, or anything else,
                        you can reach out to us.
                    </p>


                    <form class="contact-form">

                        <div class="contact-form__group">

                            <label for="name">
                                Name
                            </label>

                            <input
                                type="text"
                                id="name"
                                name="name"
                                placeholder="Your name"
                                autocomplete="name"
                                required
                            >

                        </div>


                        <div class="contact-form__group">

                            <label for="email">
                                Email
                            </label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="Your email"
                                autocomplete="email"
                                required
                            >

                        </div>


                        <div class="contact-form__group">

                            <label for="message">
                                Message
                            </label>

                            <textarea
                                id="message"
                                name="message"
                                rows="6"
                                placeholder="Write your message..."
                                required
                            ></textarea>

                        </div>


                        <button
                            type="submit"
                            class="contact-form__button"
                        >
                            Send Message
                        </button>

                    </form>

                </div>

            </div>

        </section>

    </main>


    <!-- =====================================================
         Global Footer
    ====================================================== -->

    <div id="footer"></div>


    <!-- =====================================================
         Global Application JavaScript
    ====================================================== -->

    <script
        type="module"
        src="assets/js/app.js"
    ></script>

</body>

</html>
