<!DOCTYPE html>
<html lang="en">

<head>

    <!-- =====================================================
         Meta
    ====================================================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Loans Calculators | ToolZen Hub</title>

    <meta
        name="description"
        content="Calculate, compare and plan your loans with ToolZen Hub loan calculators including EMI, Home Loan, Personal Loan and more."
    >

    <meta
        name="theme-color"
        content="#0b9f58"
    >


    <!-- =====================================================
         Google Fonts
    ====================================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================
         Base CSS
    ====================================================== -->

    <link rel="stylesheet" href="assets/css/base/variables.css">
    <link rel="stylesheet" href="assets/css/base/reset.css">
    <link rel="stylesheet" href="assets/css/base/typography.css">
    <link rel="stylesheet" href="assets/css/base/layout.css">
    <link rel="stylesheet" href="assets/css/base/animations.css">


    <!-- =====================================================
         Component CSS
    ====================================================== -->

    <link rel="stylesheet" href="assets/css/components/buttons.css">
    <link rel="stylesheet" href="assets/css/components/cards.css">
    <link rel="stylesheet" href="assets/css/components/header.css">
    <link rel="stylesheet" href="assets/css/components/navigation.css">
    <link rel="stylesheet" href="assets/css/components/forms.css">
    <link rel="stylesheet" href="assets/css/components/search.css">
    <link rel="stylesheet" href="assets/css/components/modal.css">
    <link rel="stylesheet" href="assets/css/components/table.css">
    <link rel="stylesheet" href="assets/css/components/footer.css">


    <!-- =====================================================
         Theme
    ====================================================== -->

    <link rel="stylesheet" href="assets/css/themes/light.css">


    <!-- =====================================================
         Page CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="assets/css/pages/loans.css"
    >

</head>


<body>


    <!-- =====================================================
         Global Header
    ====================================================== -->

    <header id="header"></header>


    <!-- =====================================================
         Main
    ====================================================== -->

    <main id="app">


        <!-- =================================================
             Breadcrumb
        ================================================== -->

        <section class="loans-breadcrumb">

            <div class="container">

                <nav
                    class="loans-breadcrumb__nav"
                    aria-label="Breadcrumb"
                >

                    <a href="/" class="loans-breadcrumb__home">
                        <span aria-hidden="true">⌂</span>
                        Home
                    </a>

                    <span
                        class="loans-breadcrumb__separator"
                        aria-hidden="true"
                    >
                        ›
                    </span>

                    <a
                        href="categories.html"
                        class="loans-breadcrumb__link"
                    >
                        Categories
                    </a>

                    <span
                        class="loans-breadcrumb__separator"
                        aria-hidden="true"
                    >
                        ›
                    </span>

                    <span class="loans-breadcrumb__current">
                        Loans
                    </span>

                </nav>

            </div>

        </section>


        <!-- =================================================
             Hero
        ================================================== -->

        <section class="loans-hero">

            <div class="container">

                <div class="loans-hero__content">


                    <!-- Left -->

                    <div class="loans-hero__text">

                        <h1 class="loans-hero__title">
                            Loans Calculators
                        </h1>

                        <p class="loans-hero__description">
                            Calculate, compare and plan your loans
                            with our easy to use loan calculators.
                        </p>


                        <div class="loans-hero__trust">

                            <span
                                class="loans-hero__trust-icon"
                                aria-hidden="true"
                            >
                                ✓
                            </span>

                            <span>100% Free</span>

                            <span class="loans-hero__dot">
                                •
                            </span>

                            <span>Accurate</span>

                            <span class="loans-hero__dot">
                                •
                            </span>

                            <span>Easy to Use</span>

                        </div>

                    </div>


                    <!-- Right illustration -->

                    <div
                        class="loans-hero__illustration"
                        aria-hidden="true"
                    >

                        <div class="loans-illustration">

                            <div class="loans-illustration__percent">
                                %
                            </div>

                            <div class="loans-illustration__house">

                                <div class="loans-illustration__roof"></div>

                                <div class="loans-illustration__body">

                                    <div class="loans-illustration__door"></div>

                                    <div class="loans-illustration__window">
                                        <span></span>
                                        <span></span>
                                        <span></span>
                                        <span></span>
                                    </div>

                                </div>

                            </div>


                            <div class="loans-illustration__coins">

                                <span></span>
                                <span></span>
                                <span></span>
                                <span></span>

                            </div>


                            <div class="loans-illustration__clipboard">

                                <div class="loans-illustration__clip"></div>

                                <strong>LOAN</strong>

                                <div>✓</div>
                                <div>✓</div>
                                <div>✓</div>

                            </div>


                            <div class="loans-illustration__calculator">

                                <div class="loans-illustration__display">
                                   
                                </div>

                                <div class="loans-illustration__keys">

                                    <span></span>
                                    <span></span>
                                    <span></span>
                                    <span></span>

                                    <span></span>
                                    <span></span>
                                    <span></span>
                                    <span></span>

                                    <span></span>
                                    <span></span>
                                    <span></span>
                                    <span></span>

                                </div>

                            </div>


                            <div class="loans-illustration__check">
                                ✓
                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </section>


        <!-- =================================================
             Calculator Cards
        ================================================== -->

        <section class="loans-calculators">

            <div class="container">

                <div
                    id="loans-calculators-grid"
                    class="loans-calculators__grid"
                ></div>

            </div>

        </section>


        <!-- =================================================
             Search
        ================================================== -->

        <section class="loans-search-section">

            <div class="container">

                <div class="loans-search">

                    <div class="loans-search__icon">
                        💡
                    </div>


                    <div class="loans-search__content">

                        <h2>
                            Can't find what you need?
                        </h2>

                        <p>
                            Search from 100+ calculators and tools
                        </p>

                    </div>


                    <form
                        class="loans-search__form"
                        id="loans-search-form"
                    >

                        <input
                            type="search"
                            id="loans-search-input"
                            class="loans-search__input"
                            placeholder="Search calculators..."
                            autocomplete="off"
                        >

                        <button
                            type="submit"
                            class="loans-search__button"
                            aria-label="Search calculators"
                        >
                            ⌕
                        </button>

                    </form>

                </div>

            </div>

        </section>

    </main>


    <!-- =====================================================
         Global Footer
    ====================================================== -->

    <footer id="footer"></footer>


    <!-- =====================================================
         JavaScript
    ====================================================== -->

    <script
        type="module"
        src="assets/js/pages/loans.js"
    ></script>

</body>

</html>
