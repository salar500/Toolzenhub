<!DOCTYPE html>
<html lang="en">

<head>

    <!-- ==========================================
         Meta
    =========================================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Articles & Guides | ToolZen Hub</title>

    <meta
        name="description"
        content="Helpful guides, tips and insights about finance, investment, tax, business, health and everyday calculations."
    >

    <meta
        name="theme-color"
        content="#2563eb"
    >


    <!-- ==========================================
         Favicon
    =========================================== -->

    <link
        rel="icon"
        type="image/svg+xml"
        href="/favicon.svg"
    >


    <!-- ==========================================
         Google Fonts
    =========================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- ==========================================
         Base CSS
    =========================================== -->

    <link
        rel="stylesheet"
        href="assets/css/base/variables.css"
    >

    <link
        rel="stylesheet"
        href="assets/css/base/reset.css"
    >

    <link
        rel="stylesheet"
        href="assets/css/base/typography.css"
    >

    <link
        rel="stylesheet"
        href="assets/css/base/layout.css"
    >

    <link
        rel="stylesheet"
        href="assets/css/base/animations.css"
    >


    <!-- ==========================================
         Component CSS
    =========================================== -->

    <link
        rel="stylesheet"
        href="assets/css/components/buttons.css"
    >

    <link
        rel="stylesheet"
        href="assets/css/components/cards.css"
    >

    <link
        rel="stylesheet"
        href="assets/css/components/header.css"
    >

    <link
        rel="stylesheet"
        href="assets/css/components/navigation.css"
    >

    <link
        rel="stylesheet"
        href="assets/css/components/forms.css"
    >

    <link
        rel="stylesheet"
        href="assets/css/components/search.css"
    >

    <link
        rel="stylesheet"
        href="assets/css/components/categories.css"
    >

    <link
        rel="stylesheet"
        href="assets/css/components/footer.css"
    >


    <!-- ==========================================
         Theme
    =========================================== -->

    <link
        rel="stylesheet"
        href="assets/css/themes/light.css"
    >


    <!-- ==========================================
         Articles Page CSS
    =========================================== -->

    <link
        rel="stylesheet"
        href="assets/css/pages/articles.css"
    >

</head>


<body>


    <!-- ==========================================
         Global Header
         Rendered by header.js
    =========================================== -->

    <header id="header"></header>


    <!-- ==========================================
         Main Application
         Articles page is rendered by:
         assets/js/pages/articles/articles.js
    =========================================== -->

    <main id="app"></main>


    <!-- ==========================================
         Global Footer
         Rendered by footer.js
    =========================================== -->

    <footer id="footer"></footer>


    <!-- ==========================================
         JavaScript Entry Point
         app.js handles routing and loads
         the correct page automatically.
    =========================================== -->

    <script
        type="module"
        src="assets/js/app.js"
    ></script>

</body>

</html>
