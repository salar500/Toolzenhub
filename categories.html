<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        All Categories | ToolZen Hub
    </title>

    <meta
        name="description"
        content="Explore all calculators and smart tools available on ToolZen Hub."
    >


    <!-- =========================================
         Global CSS
    ========================================== -->

    <link
        rel="stylesheet"
        href="assets/css/style.css"
    >


    <!-- =========================================
         Header CSS
    ========================================== -->

    <link
        rel="stylesheet"
        href="assets/css/components/header.css"
    >


    <!-- =========================================
         Footer CSS
    ========================================== -->

    <link
        rel="stylesheet"
        href="assets/css/components/footer.css"
    >


    <!-- =========================================
         Categories CSS
    ========================================== -->

    <link
        rel="stylesheet"
        href="assets/css/pages/categories.css"
    >

</head>


<body class="categories-page-body">


    <!-- =========================================
         Header
    ========================================== -->

    <div id="header"></div>


    <!-- =========================================
         Main Application
    ========================================== -->

    <main id="app">

        <section class="categories-page">

            <div class="container">


                <!-- =====================================
                     Intro
                ====================================== -->

                <div class="categories-page__intro">

                    <span class="categories-page__eyebrow">
                        Calculators & Tools
                    </span>

                    <h1 class="categories-page__title">
                        All Categories
                    </h1>

                    <p class="categories-page__description">
                        Explore our wide range of calculators and smart tools
                    </p>

                </div>


                <!-- =====================================
                     Category Grid
                ====================================== -->

                <div
                    id="categories-grid"
                    class="categories-page__grid"
                ></div>


                <!-- =====================================
                     Search
                ====================================== -->

                <div class="categories-search">


                    <div class="categories-search__icon">
                        💡
                    </div>


                    <div class="categories-search__content">

                        <h2>
                            Can't find what you need?
                        </h2>

                        <p>
                            Search from 100+ calculators and tools
                        </p>

                    </div>


                    <form
                        class="categories-search__form"
                        id="categories-search-form"
                    >

                        <input
                            type="search"
                            id="categories-search-input"
                            class="categories-search__input"
                            placeholder="Search calculators..."
                            aria-label="Search calculators"
                        >

                        <button
                            type="submit"
                            class="categories-search__button"
                            aria-label="Search"
                        >
                            🔍
                        </button>

                    </form>


                </div>


            </div>

        </section>

    </main>


    <!-- =========================================
         Footer
    ========================================== -->

    <div id="footer"></div>


    <!-- =========================================
         Page JavaScript
    ========================================== -->

    <script
        type="module"
        src="assets/js/pages/categories.js"
    ></script>


</body>

</html>
