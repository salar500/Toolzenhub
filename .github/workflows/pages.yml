# GitHub Pages PREVIEW deployment.
#
# Builds the site for the /Toolzenhub/ path and deploys ONLY the generated output (dist-ghpages/).
# Source templates, tests and tooling are never published. Canonical URLs stay on https://toolzenhub.in.
#
# One-time repository setting: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
name: Deploy GitHub Pages preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits instead of cancelling a deployment already in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:preview
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-ghpages
      - id: deployment
        uses: actions/deploy-pages@v4
