# GitHub Pages PREVIEW deployment.
#
# Builds the site for the /Toolzenhub/ path and deploys ONLY the generated output (dist-ghpages/).
# Source templates, tests and tooling are never published. Canonical URLs stay on https://toolzenhub.in.
#
# One-time repository setting: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
name: Deploy GitHub Pages preview

# The preview site is ONE site (https://salar500.github.io/Toolzenhub/): whichever listed branch was pushed last is what it shows. main is the
# normal source; the development branch is listed while a development cycle is under visual review, and is removed again when it is merged.
# The github-pages environment must also allow the branch (Settings -> Environments -> github-pages -> Deployment branches), or the deploy step is
# refused. Neither branch touches Hostinger (toolzenhub.in), which is uploaded by hand.
on:
  push:
    branches: [main, feature/unified-ecosystem-workspace]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits instead of cancelling a deployment already in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:preview
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-ghpages
      - id: deployment
        uses: actions/deploy-pages@v4
